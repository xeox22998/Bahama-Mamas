# Bahama Mamas — configuration Netlify
# - le site (vitrine + espace staff) est dans « public/ »
# - la base partagée est une fonction Netlify (netlify/functions/api.mjs)
#   qui range les données dans Netlify Blobs (aucun réglage à faire)

[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/espace.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
